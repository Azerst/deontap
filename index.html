<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Giữa Kì 1 - Vật Lý 12</title>
    <style>
        @font-face {
            font-family: "GFF-Latin-Bold";
            src: url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),
                 url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }

        body {
            font-family: 'GFF-Latin-Bold', sans-serif;
            color: #1e293b;
            line-height: 1.65;
            min-height: 100vh;
            letter-spacing: 0.25px;
            position: relative;
            overflow-x: hidden;
            background: #f8f9ff;
            font-size: 14px;
        }
        body::before {
            content: "";
            position: fixed;
            inset: -30%;
            z-index: -2;
            background:
                radial-gradient(circle at 18% 25%, rgba(168,200,245,0.75), transparent 40%),
                radial-gradient(circle at 82% 15%, rgba(245,180,210,0.65), transparent 40%),
                radial-gradient(circle at 78% 82%, rgba(165,230,220,0.72), transparent 40%),
                radial-gradient(circle at 15% 85%, rgba(215,190,250,0.68), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(253,220,180,0.35), transparent 55%);
            filter: blur(85px);
            animation: liquidMove 28s ease-in-out infinite;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image:
                radial-gradient(rgba(255,255,255,0.6) 1px, transparent 1px),
                radial-gradient(rgba(255,255,255,0.35) 1px, transparent 1px);
            background-size: 44px 44px, 88px 88px;
            background-position: 0 0, 22px 22px;
            opacity: 0.45;
            pointer-events: none;
            mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
            -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
        }
        @keyframes liquidMove {
            0%, 100% { transform: translate(0,0) scale(1) rotate(0deg); }
            25% { transform: translate(-3%,2%) scale(1.08) rotate(2deg); }
            50% { transform: translate(2%,-3%) scale(1.04) rotate(-1deg); }
            75% { transform: translate(-2%,-2%) scale(1.06) rotate(1.5deg); }
        }

        .app-container {
            display: flex;
            max-width: 1320px;
            margin: 0 auto;
            padding: 18px;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            width: 260px;
            background: linear-gradient(135deg, rgba(255,255,255,0.72), rgba(255,255,255,0.42));
            backdrop-filter: blur(50px) saturate(200%);
            -webkit-backdrop-filter: blur(50px) saturate(200%);
            border-radius: 24px;
            padding: 24px 18px;
            box-shadow:
                0 24px 65px rgba(100,120,180,0.12),
                inset 0 1.5px 0 rgba(255,255,255,1),
                inset 0 -1px 1px rgba(255,255,255,0.4),
                inset 1px 0 1px rgba(255,255,255,0.6);
            height: calc(100vh - 36px);
            position: sticky;
            top: 18px;
            overflow-y: auto;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.98);
            position: relative;
        }
        .sidebar::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 55%; height: 30%;
            background: radial-gradient(ellipse at 0% 0%, rgba(255,255,255,0.9), transparent 60%);
            border-radius: 24px 0 100% 0;
            pointer-events: none;
            opacity: 0.7;
        }
        .sidebar h2 {
            font-size: 0.95rem;
            color: #7c3aed;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1.6px;
            position: relative;
            padding-bottom: 12px;
        }
        .sidebar h2::after {
            content: "";
            position: absolute;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 60px; height: 2.5px;
            border-radius: 3px;
            background: linear-gradient(90deg, transparent, #a78bfa, #f0abfc, #7dd3fc, transparent);
        }
        .menu-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .menu-item {
            padding: 12px 16px;
            border-radius: 13px;
            cursor: pointer;
            background: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.92);
            backdrop-filter: blur(14px);
            transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
            font-size: 0.88rem;
            color: #475569;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
        }
        .menu-item::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.9) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.8s ease;
        }
        .menu-item:hover::before { transform: translateX(100%); }
        .menu-item:hover {
            background: rgba(255,255,255,0.9);
            border-color: rgba(167,139,250,0.55);
            color: #7c3aed;
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(139,92,246,0.15), inset 0 1px 0 rgba(255,255,255,0.9);
        }
        .menu-item.active {
            background: linear-gradient(135deg, #a78bfa, #f0abfc, #7dd3fc);
            background-size: 200% 200%;
            animation: gradientShift 5s ease infinite;
            color: white;
            border-color: transparent;
            box-shadow: 0 10px 26px rgba(167,139,250,0.42), inset 0 1px 1px rgba(255,255,255,0.55);
            transform: scale(1.02);
            text-shadow: 0 1px 2px rgba(80,40,120,0.25);
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .main-content {
            flex: 1;
            min-width: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(255,255,255,0.42));
            backdrop-filter: blur(55px) saturate(200%);
            -webkit-backdrop-filter: blur(55px) saturate(200%);
            border-radius: 28px;
            padding: 34px;
            box-shadow:
                0 30px 80px rgba(100,120,180,0.14),
                inset 0 2px 0 rgba(255,255,255,1),
                inset 0 -1px 1px rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.98);
            position: relative;
            overflow: hidden;
        }
        .main-content::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.5px;
            background: linear-gradient(135deg,
                rgba(147,197,253,0.85), rgba(249,168,212,0.75),
                rgba(134,239,172,0.6), rgba(196,181,253,0.85), rgba(147,197,253,0.85));
            background-size: 300% 300%;
            animation: borderFlow 10s ease infinite;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 2;
        }
        .main-content::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 45%; height: 22%;
            background: radial-gradient(ellipse at 0% 0%, rgba(255,255,255,0.85), transparent 65%);
            border-radius: 28px 0 100% 0;
            pointer-events: none;
            opacity: 0.55;
            z-index: 1;
        }
        @keyframes borderFlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .exam-section {
            display: none;
            animation: fadeIn 0.55s cubic-bezier(0.34,1.56,0.64,1);
            position: relative;
            z-index: 3;
        }
        .exam-section.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            text-align: center;
            font-size: 1.55rem;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899, #0ea5e9, #8b5cf6);
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 7s ease infinite;
        }
        h2.part-title {
            color: #be123c;
            margin: 32px 0 18px;
            font-size: 1rem;
            padding: 11px 18px;
            background: linear-gradient(90deg, rgba(254,205,211,0.55), rgba(255,255,255,0.3), transparent);
            border-left: 4px solid #fb7185;
            border-radius: 0 12px 12px 0;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            letter-spacing: 0.4px;
        }

        .question {
            margin-bottom: 20px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(255,255,255,0.62), rgba(255,255,255,0.38));
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.94);
            box-shadow:
                0 8px 26px rgba(100,120,180,0.07),
                inset 0 1.5px 0 rgba(255,255,255,1),
                inset 0 -1px 1px rgba(255,255,255,0.4);
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }
        .question::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 50%; height: 35%;
            background: radial-gradient(ellipse at 0% 0%, rgba(255,255,255,0.7), transparent 70%);
            border-radius: 18px 0 100% 0;
            pointer-events: none;
            opacity: 0.55;
        }
        .question:hover {
            box-shadow:
                0 14px 38px rgba(139,92,246,0.10),
                inset 0 1.5px 0 rgba(255,255,255,1);
        }

        .q-text {
            font-size: 0.92rem;
            margin-bottom: 14px;
            color: #1e293b;
            line-height: 1.55;
            position: relative;
            z-index: 1;
        }

        /* CSS cho Bảng và Ảnh (Có thể cuộn ngang) */
        .data-table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            background: rgba(255,255,255,0.65);
            position: relative;
            z-index: 1;
            cursor: zoom-in;
        }
        .data-table {
            width: 100%;
            min-width: 500px; 
            border-collapse: collapse;
            font-size: 0.9rem;
            text-align: center;
        }
        .data-table th, .data-table td {
            border: 1px solid rgba(203,213,225,0.8);
            padding: 8px 10px;
        }
        .data-table th {
            background: rgba(237,233,254,0.85);
            color: #6d28d9;
            font-weight: bold;
        }
        
        .illustration-container {
            width: 100%;
            overflow-x: auto;
            margin: 15px 0;
            padding-bottom: 5px;
            position: relative;
            z-index: 1;
            cursor: zoom-in;
        }
        .illustration-container svg {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            background: rgba(255,255,255,0.7);
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.9);
            transition: transform 0.3s ease;
        }
        .illustration-container:hover svg {
            transform: scale(1.02);
        }
        
        .options-grid-4-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 15px;
            padding-bottom: 10px;
            position: relative;
            z-index: 1;
            cursor: zoom-in;
        }
        .options-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            min-width: 600px; 
        }
        @media (max-width: 768px) {
            .options-grid-4 { grid-template-columns: repeat(4, 140px); } 
        }
        .options-grid-4 svg {
            width: 100%;
            height: auto;
            background: rgba(255,255,255,0.7);
            border-radius: 8px;
            border: 1px solid rgba(203,213,225,0.6);
            transition: transform 0.3s ease;
        }
        .options-grid-4-wrapper:hover .options-grid-4 svg {
            transform: scale(1.02);
        }

        /* Custom Scrollbar */
        .data-table-wrapper::-webkit-scrollbar,
        .illustration-container::-webkit-scrollbar,
        .options-grid-4-wrapper::-webkit-scrollbar {
            height: 6px;
        }
        .data-table-wrapper::-webkit-scrollbar-track,
        .illustration-container::-webkit-scrollbar-track,
        .options-grid-4-wrapper::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
        }
        .data-table-wrapper::-webkit-scrollbar-thumb,
        .illustration-container::-webkit-scrollbar-thumb,
        .options-grid-4-wrapper::-webkit-scrollbar-thumb {
            background: #a78bfa;
            border-radius: 10px;
        }

        /* LIGHTBOX MODAL */
        #image-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #image-modal.active {
            display: flex;
            opacity: 1;
        }
        #image-modal-content {
            background: white;
            padding: 15px;
            border-radius: 16px;
            max-width: 95vw;
            max-height: 90vh;
            overflow: auto;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        #image-modal.active #image-modal-content {
            transform: scale(1);
        }
        #image-modal-close {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 36px;
            height: 36px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(239,68,68,0.4);
            transition: all 0.2s;
        }
        #image-modal-close:hover {
            background: #dc2626;
            transform: scale(1.1);
        }
        #image-modal-content svg {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .options { display: flex; flex-direction: column; gap: 9px; position: relative; z-index: 1; }
        .options label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 15px;
            background: rgba(255,255,255,0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(203,213,225,0.5);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
            font-size: 0.87rem;
            color: #334155;
            min-width: 0;
            word-break: break-word;
            overflow-wrap: break-word;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
        }
        .options label::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.95) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.8s ease;
            pointer-events: none;
        }
        .options label:hover::before { transform: translateX(100%); }

        .options input[type="radio"] {
            margin-right: 2px;
            width: 16px; height: 16px;
            accent-color: #a78bfa;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .options label > span { position: relative; z-index: 1; }

        .options label:not(:has(input:checked)):not(:has(input:disabled)):hover {
            background: rgba(255,255,255,0.9);
            border-color: rgba(167,139,250,0.55);
            transform: translateX(5px);
            box-shadow:
                0 8px 22px rgba(139,92,246,0.13),
                inset 0 1px 0 rgba(255,255,255,0.95);
        }

        .options label:has(input:checked) {
            background: linear-gradient(135deg, rgba(254,205,211,0.6), rgba(251,207,232,0.45));
            backdrop-filter: blur(22px) saturate(200%);
            -webkit-backdrop-filter: blur(22px) saturate(200%);
            border: 1.5px solid #f43f5e;
            color: #9f1239;
            transform: translateX(5px) scale(1.01);
            box-shadow:
                0 0 0 3px rgba(244,63,94,0.12),
                0 10px 28px rgba(244,63,94,0.22),
                inset 0 1.5px 0 rgba(255,255,255,0.9);
            animation: pulseRose 1.8s ease-in-out infinite;
        }
        @keyframes pulseRose {
            0%, 100% { box-shadow: 0 0 0 3px rgba(244,63,94,0.12), 0 10px 28px rgba(244,63,94,0.22), inset 0 1.5px 0 rgba(255,255,255,0.9); }
            50% { box-shadow: 0 0 0 5px rgba(244,63,94,0.18), 0 14px 36px rgba(244,63,94,0.35), inset 0 1.5px 0 rgba(255,255,255,0.95); }
        }

        .options label.correct,
        .options label.correct:has(input:checked) {
            background: linear-gradient(135deg, rgba(209,250,229,0.8), rgba(167,243,208,0.6));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-color: #10b981;
            color: #047857;
            transform: translateX(5px) scale(1.01);
            box-shadow:
                0 0 0 3px rgba(16,185,129,0.15),
                0 10px 28px rgba(16,185,129,0.22),
                inset 0 1.5px 0 rgba(255,255,255,0.9);
            animation: popCorrect 0.65s cubic-bezier(0.34,1.56,0.64,1) forwards;
        }
        @keyframes popCorrect {
            0% { transform: translateX(5px) scale(1.01); }
            45% { transform: translateX(5px) scale(1.06); box-shadow: 0 0 0 8px rgba(16,185,129,0.15), 0 14px 40px rgba(16,185,129,0.4), inset 0 1.5px 0 rgba(255,255,255,0.95); }
            100% { transform: translateX(5px) scale(1.01); }
        }

        .options label.incorrect,
        .options label.incorrect:has(input:checked) {
            background: linear-gradient(135deg, rgba(254,202,202,0.75), rgba(254,226,226,0.55));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-color: #ef4444;
            color: #b91c1c;
            transform: translateX(5px) scale(1.01);
            box-shadow:
                0 0 0 3px rgba(239,68,68,0.15),
                0 10px 28px rgba(239,68,68,0.22),
                inset 0 1.5px 0 rgba(255,255,255,0.9);
            animation: shakeWrong 0.55s cubic-bezier(0.36,0.07,0.19,0.97) forwards;
        }
        @keyframes shakeWrong {
            0%, 100% { transform: translateX(5px) scale(1.01); }
            15% { transform: translateX(-4px) scale(1.01); }
            30% { transform: translateX(4px) scale(1.01); }
            45% { transform: translateX(-3px) scale(1.01); }
            60% { transform: translateX(3px) scale(1.01); }
            75% { transform: translateX(-2px) scale(1.01); }
        }

        .options label.correct > span::after,
        .options label.incorrect > span::after {
            font-weight: bold;
            margin-left: 8px;
            display: inline-block;
            animation: iconPop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
        }
        .options label.correct > span::after { content: "✓"; color: #059669; }
        .options label.incorrect > span::after { content: "✗"; color: #dc2626; }
        @keyframes iconPop {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }

        .options label:has(input:disabled):not(.correct):not(.incorrect) {
            opacity: 0.42;
            cursor: not-allowed;
            filter: grayscale(0.55);
        }
        .options input[type="radio"]:disabled { cursor: not-allowed; }

        .tf-statement {
            margin-bottom: 12px;
            padding: 15px;
            background: rgba(255,255,255,0.48);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.9);
            border-radius: 13px;
            transition: all 0.3s ease;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
        }
        .tf-statement:hover { background: rgba(255,255,255,0.65); }
        .tf-statement p { font-size: 0.9rem; margin-bottom: 12px; color: #1e293b; }
        .tf-buttons { display: flex; gap: 10px; }
        .tf-btn {
            padding: 8px 22px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.88rem;
            color: white;
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            position: relative;
            overflow: hidden;
        }
        .tf-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: translateX(-100%);
            transition: transform 0.55s ease;
        }
        .tf-btn:hover::after { transform: translateX(100%); }
        .btn-true { background: linear-gradient(135deg, #60a5fa, #818cf8); box-shadow: 0 4px 14px rgba(96,165,250,0.35); }
        .btn-true:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 22px rgba(96,165,250,0.5); }
        .btn-false { background: linear-gradient(135deg, #94a3b8, #64748b); box-shadow: 0 4px 14px rgba(100,116,139,0.3); }
        .btn-false:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 22px rgba(100,116,139,0.45); }
        .tf-btn.selected-correct {
            background: linear-gradient(135deg, #10b981, #34d399) !important;
            box-shadow: 0 0 20px rgba(16,185,129,0.55) !important;

                {q: "Người ta thực hiện công 100J để nén khí trong một xilanh. Khí truyền ra môi trường xung quanh nhiệt lượng 20J.",
                 s: [["a) Khối khí truyền nhiệt ra môi trường bên ngoài nên Q<0 và có giá trị âm -20J.", true, "Tỏa nhiệt → Q < 0, Q = -20J."],
                     ["b) Do khối khí nhận công A<0 và có giá trị -100J.", false, "Nén khí là nhận công, A > 0. A = +100J."],
                     ["c) Độ biến thiên nội năng của khí có giá trị -80J.", false, "ΔU = 100 - 20 = 80J."],
                     ["d) Người ta thực hiện công lên khối khí nên khối khí nhận công.", true, "Nén khí là thực hiện công lên khí."]]}
            ],
            sa: [
                {q: "Cần một nhiệt lượng bao nhiêu MJ để làm 2 kg nước đá ở nhiệt độ 0°C tan hoàn hoàn, biết nhiệt nóng chảy riêng của nước đá là 3,4.10^5 J/kg. ( Kết quả làm tròn lấy 2 chữ số thập phân sau dấu phẩy )", a: "0.68",
                 tt: "m = 2 kg<br>λ = 3,4.10⁵ J/kg<br>t = 0°C",
                 ct: "<code>Q = m.λ</code>",
                 gt: "<ul><li><code>Q</code> nhiệt lượng (J)</li><li><code>m</code> khối lượng (kg)</li><li><code>λ</code> nhiệt nóng chảy riêng (J/kg)</li></ul>",
                 sol: "Q = 680 000 J = <b>0,68 MJ</b>."},
                {q: "Sự phụ thuộc vào nhiệt độ của bước sóng điện từ theo hệ thức Wien: T.λ_max = 2900(µm.K) được dùng vào việc chế tạo các nhiệt kế thường dùng hằng ngày như nhiệt kế hồng ngoại, cũng như các nhiệt kế trong thang vận để đo nhiệt độ bề mặt của các thiên thể. Dùng một nhiệt kế hồng ngoại để đo nhiệt độ cơ thể người khi đó là 36,5°C. Bước sóng hồng ngoại do cơ thể người phát ra bằng xấp xỉ bằng bao nhiêu µm? (Kết quả làm tròn lấy một số thập phân sau dấu phẩy)", a: "9.4",
                 tt: "t = 36,5°C → T = 309,5 K<br>b = 2900 µm.K",
                 ct: "<code>λ_max = b/T</code>",
                 gt: "<ul><li><code>λ_max</code> bước sóng cực đại (µm)</li><li><code>b</code> hằng số Wien (µm.K)</li><li><code>T</code> nhiệt độ tuyệt đối (K)</li></ul>",
                 sol: "λ_max = 2900/309,5 ≈ <b>9,4 µm</b>."},
                {q: "Người ta cung cấp nhiệt lượng 2 J cho chất khí đựng trong một xilanh đặt nằm ngang. Chất khí nở ra, đẩy pit tong đi một đoạn 5 cm. Biết lực ma sát giữa pittong và xilanh có độ lớn 10 N. Hỏi nội năng của khí biến thiên một lượng là bao nhiêu J? ( Kết quả làm tròn lấy 1 số thập phân sau dấu phẩy)", a: "1.5",
                 tt: "Q = 2 J<br>F = 10 N; s = 0,05 m",
                 ct: "<code>A = −F.s; ΔU = Q + A</code>",
                 gt: "<ul><li><code>Q</code> nhiệt lượng (J)</li><li><code>A</code> công cản (J)</li><li><code>F</code> lực (N)</li><li><code>s</code> quãng đường (m)</li><li><code>ΔU</code> độ biến thiên nội năng (J)</li></ul>",
                 sol: "A = −0,5 J → ΔU = <b>1,5 J</b>."},
                {q: "Trong thí nghiệm đo nhiệt nóng chảy riêng của nước đá, người ta sử dụng 0,6 kg nước đá. Oát kế đo được là 930 W trong thời gian 220s. Cho rằng nhiệt lượng hao phí tỏa ra môi trường bên ngoài bằng 3% điện năng tiêu thụ của hệ thống. Nhiệt nóng chảy riêng của nước đá do được bằng bao nhiêu J/g? (Kết quả làm tròn đến chữ số hàng đơn vị)", a: "330",
                 tt: "m = 0,6 kg<br>P = 930 W; t = 220 s<br>H = 97%",
                 ct: "<code>λ = P.t.H/m</code>",
                 gt: "<ul><li><code>λ</code> nhiệt nóng chảy riêng (J/kg)</li><li><code>P</code> công suất (W)</li><li><code>t</code> thời gian (s)</li><li><code>H</code> hiệu suất</li></ul>",
                 sol: "• Q_tp = 204 600 J<br>• Q_ích = 198 462 J<br>• λ ≈ <b>330 J/g</b>"},
                {q: "Một bình nhôm khối lượng 0,5 kg đựng 2 kg nước ở 20°C. Thả vào bình một thỏi đồng khối lượng 200 g lấy ra từ bếp lò. Khi hệ xảy ra cân bằng thì nhiệt độ của nước là 21,2°C. Biết nhiệt dung riêng của nhôm, nước và đồng lần lượt là 880J/kg.K; 4200J/kg.K và 380J/kg.K. Bỏ qua sự tỏa nhiệt ra môi trường. Nhiệt độ của bếp lò là bao nhiêu °C (Kết quả làm tròn đến hàng đơn vị)", a: "160",
                 tt: "m_Al = 0,5 kg; c = 880<br>m_n = 2 kg; c = 4200<br>m_Cu = 0,2 kg; c = 380<br>t₁ = 20°C; t_cb = 21,2°C",
                 ct: "<code>Q_thu = Q_tỏa</code>",
                 gt: "<ul><li><code>Q_thu</code> nhiệt lượng bình + nước thu (J)</li><li><code>Q_tỏa</code> nhiệt lượng thỏi đồng tỏa (J)</li><li><code>t_x</code> nhiệt độ bếp lò cần tìm (°C)</li></ul>",
                 sol: "• Q_thu = 10 608 J<br>• Q_tỏa = 76.(t_x − 21,2)<br>• t_x ≈ <b>160°C</b>"},
                {q: "Cung cấp 1000 J nhiệt lượng cho một vật có khối lượng 300 g thì nhiệt độ của vật này tăng từ 25°C đến 45°C. Nhiệt dung riêng của vật đó là bao nhiêu J/kg.K? (Kết quả làm tròn đến chữ số hàng đơn vị).", a: "167",
                 tt: "Q = 1000 J<br>m = 0,3 kg; Δt = 20°C",
                 ct: "<code>c = Q/(m.Δt)</code>",
                 gt: "<ul><li><code>c</code> nhiệt dung riêng (J/kg.K)</li><li><code>Q</code> nhiệt lượng (J)</li><li><code>m</code> khối lượng (kg)</li><li><code>Δt</code> độ tăng nhiệt độ (°C)</li></ul>",
                 sol: "c = 1000/6 ≈ <b>167 J/(kg.K)</b>."}
            ]
        }
    ];

    const menuList = document.getElementById('menu-list');
    const quizContainer = document.getElementById('quiz-container');

    // Hàm tạo nút Xem lời giải và khối lời giải
    function generateSolutionHTML(q) {
        let noteHTML = '';
        if (q.gt) {
            noteHTML = `<div class="sol-section sol-note"><strong>📖 Chú thích đại lượng</strong>${q.gt}</div>`;
        }

        let solContent = '';
        if (q.tt && q.ct) {
            solContent = `<div class="solution-box solution-multi">
                <div class="sol-section sol-summary"><strong>📋 Tóm tắt</strong><div>${q.tt}</div></div>
                <div class="sol-section sol-formula"><strong>📐 Công thức</strong><div>${q.ct}</div></div>
                ${noteHTML}
                <div class="sol-section sol-detail"><strong>✏️ Lời giải chi tiết</strong><div>${q.sol}</div></div>
            </div>`;
        } else {
            solContent = `<div class="solution-box"><strong>💡 Lời giải chi tiết:</strong> ${q.sol}</div>`;
        }

        return `<button class="toggle-sol-btn" onclick="toggleSolution(this)">💡 Xem lời giải chi tiết</button>
                ${solContent}`;
    }

    examData.forEach((exam, examIndex) => {
        const li = document.createElement('li');
        li.className = `menu-item ${examIndex === 0 ? 'active' : ''}`;
        li.textContent = exam.title;
        li.onclick = () => switchExam(examIndex);
        menuList.appendChild(li);

        let examHTML = `<div class="exam-section ${examIndex === 0 ? 'active' : ''}" id="exam-${examIndex}">
            <h1>${exam.title}</h1>`;

        examHTML += `<h2 class="part-title">PHẦN I. Trắc nghiệm nhiều phương án lựa chọn</h2>`;
        exam.mc.forEach((q, qIndex) => {
            examHTML += `<div class="question" data-answer="${q.a}" data-exam="${examIndex}" data-q="${qIndex}">
                <p class="q-text">Câu ${qIndex + 1}. ${q.q}</p>`;
            
            if (q.img) examHTML += q.img;

            examHTML += `<div class="options">`;
            q.o.forEach((opt, oIndex) => {
                const letter = String.fromCharCode(65 + oIndex);
                examHTML += `<label>
                    <input type="radio" name="mc_${examIndex}_${qIndex}" value="${letter}">
                    <span><b>${letter}.</b> ${opt}</span>
                </label>`;
            });
            examHTML += `</div>`;
            
            examHTML += generateSolutionHTML(q);
            
            examHTML += `</div>`;
        });

        examHTML += `<h2 class="part-title">PHẦN II. Trắc nghiệm Đúng/Sai</h2>`;
        exam.tf.forEach((qBlock, tfIndex) => {
            examHTML += `<div class="question">
                <p class="q-text">Câu ${tfIndex + 1}: ${qBlock.q}</p>`;
            
            if (qBlock.img) examHTML += qBlock.img;

            qBlock.s.forEach((stmt) => {
                examHTML += `<div class="tf-statement" data-correct="${stmt[1]}">
                    <p>${stmt[0]}</p>
                    <div class="tf-buttons">
                        <button class="tf-btn btn-true" onclick="checkTF(this)">Đúng</button>
                        <button class="tf-btn btn-false" onclick="checkTF(this)">Sai</button>
                    </div>
                    ${generateSolutionHTML({sol: stmt[2]})}
                </div>`;
            });
            examHTML += `</div>`;
        });

        examHTML += `<h2 class="part-title">PHẦN III. Trắc nghiệm trả lời ngắn</h2>`;
        exam.sa.forEach((q, saIndex) => {
            examHTML += `<div class="sa-block">
                <p class="q-text">Câu ${saIndex + 1}: ${q.q}</p>`;
            
            if (q.img) examHTML += q.img;

            examHTML += `<div class="sa-input-group">
                    <input type="number" step="any" class="sa-input" placeholder="Nhập đáp án...">
                    <button onclick="checkSA(this, '${q.a}')">Kiểm tra</button>
                    <span class="sa-result"></span>
                </div>
                ${generateSolutionHTML(q)}
            </div>`;
        });

        examHTML += `</div>`;
        quizContainer.innerHTML += examHTML;
    });

    function switchExam(index) {
        document.querySelectorAll('.menu-item').forEach((item, i) => item.classList.toggle('active', i === index));
        document.querySelectorAll('.exam-section').forEach((section, i) => section.classList.toggle('active', i === index));
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Hàm ẩn/hiện lời giải
    function toggleSolution(btn) {
        const solBox = btn.nextElementSibling;
        if (solBox.style.display === 'none' || solBox.style.display === '') {
            solBox.style.display = 'block';
            btn.textContent = '🙈 Ẩn lời giải chi tiết';
            btn.classList.add('active');
        } else {
            solBox.style.display = 'none';
            btn.textContent = '💡 Xem lời giải chi tiết';
            btn.classList.remove('active');
        }
    }

    // Xử lý chọn đáp án trắc nghiệm
    document.querySelectorAll('.question[data-answer]').forEach(question => {
        const correctAnswer = question.getAttribute('data-answer');
        const labels = question.querySelectorAll('.options label');
        const toggleBtn = question.querySelector('.toggle-sol-btn');

        labels.forEach(label => {
            const radio = label.querySelector('input[type="radio"]');
            radio.addEventListener('change', () => {
                if (!radio.checked) return;
                question.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
                setTimeout(() => {
                    if (radio.value === correctAnswer) {
                        label.classList.add('correct');
                    } else {
                        label.classList.add('incorrect');
                        const correctLabel = question.querySelector(`input[value="${correctAnswer}"]`).closest('label');
                        if (correctLabel) correctLabel.classList.add('correct');
                    }
                    toggleBtn.style.display = 'inline-flex';
                }, 650);
            });
        });
    });

    // Xử lý Đúng/Sai
    function checkTF(button) {
        const statement = button.closest('.tf-statement');
        const isCorrect = statement.getAttribute('data-correct') === 'true';
        const isTrueBtn = button.classList.contains('btn-true');
        const buttons = statement.querySelectorAll('.tf-btn');
        const toggleBtn = statement.querySelector('.toggle-sol-btn');
        
        buttons.forEach(btn => btn.classList.remove('selected-correct', 'selected-incorrect', 'highlight-correct'));
        if ((isTrueBtn && isCorrect) || (!isTrueBtn && !isCorrect)) {
            button.classList.add('selected-correct');
        } else {
            button.classList.add('selected-incorrect');
            statement.querySelector(isCorrect ? '.btn-true' : '.btn-false').classList.add('highlight-correct');
        }
        toggleBtn.style.display = 'inline-flex';
    }

    // Xử lý Trả lời ngắn
    function checkSA(button, correctAns) {
        const input = button.previousElementSibling;
        const resultSpan = button.nextElementSibling;
        const solBlock = button.closest('.sa-block');
        const toggleBtn = solBlock.querySelector('.toggle-sol-btn');
        
        const userAns = parseFloat(input.value);
        const trueAns = parseFloat(correctAns);
        resultSpan.classList.remove('correct', 'incorrect');
        
        if (isNaN(userAns)) {
            resultSpan.textContent = "Vui lòng nhập số!";
            resultSpan.classList.add('incorrect');
            return;
        }
        
        if (Math.abs(userAns - trueAns) < 0.05) {
            resultSpan.textContent = "✓ Chính xác!";
            resultSpan.classList.add('correct');
            input.style.borderColor = "#10b981";
        } else {
            resultSpan.textContent = `✗ Sai! Đáp án: ${correctAns}`;
            resultSpan.classList.add('incorrect');
            input.style.borderColor = "#ef4444";
        }
        toggleBtn.style.display = 'inline-flex';
    }

    // XỬ LÝ MODAL PHÓNG TO
    function openModal(element) {
        let contentToClone = element.querySelector('svg');
        if (!contentToClone) {
            contentToClone = element.querySelector('table');
        }
        
        if (!contentToClone) return;

        const container = document.getElementById('modal-svg-container');
        const clonedContent = contentToClone.cloneNode(true);
        
        if (clonedContent.tagName === 'svg') {
            clonedContent.style.width = '100%';
            clonedContent.style.maxWidth = '900px';
            clonedContent.style.height = 'auto';
        } else if (clonedContent.tagName === 'table') {
            clonedContent.style.width = '100%';
            clonedContent.style.maxWidth = '900px';
            clonedContent.style.fontSize = '1.2rem';
        }

        container.innerHTML = '';
        container.appendChild(clonedContent);

        document.getElementById('image-modal').classList.add('active');
    }

    function closeModal(event) {
        if (event.target.id === 'image-modal' || event.target.id === 'image-modal-close') {
            document.getElementById('image-modal').classList.remove('active');
            setTimeout(() => {
                document.getElementById('modal-svg-container').innerHTML = '';
            }, 300);
        }
    }
</script>

</body>
</html>
