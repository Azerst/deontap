<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Tạo Ảnh Thành Link - Imgur</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            background: #eef1ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e0e7ff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #667eea;
            font-weight: 600;
            font-size: 16px;
        }

        .upload-hint {
            color: #aaa;
            font-size: 13px;
            margin-top: 5px;
        }

        input[type="file"] {
            display: none;
        }

        .preview-container {
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f0fff4;
            border-radius: 10px;
            border-left: 5px solid #38a169;
            display: none;
            word-break: break-all;
        }

        .result label {
            font-weight: 600;
            color: #276749;
            display: block;
            margin-bottom: 8px;
        }

        .link-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .link-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #c6f6d5;
            border-radius: 8px;
            font-size: 14px;
            color: #2d3748;
            background: #fff;
        }

        .copy-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #38a169;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background: #2f855a;
        }

        .copy-btn.copied {
            background: #3182ce;
        }

        .error {
            margin-top: 20px;
            padding: 15px;
            background: #fff5f5;
            border-radius: 10px;
            border-left: 5px solid #e53e3e;
            color: #c53030;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📤 Tạo Ảnh Thành Link</h1>
        <p class="subtitle">Tải ảnh lên và nhận liên kết trực tiếp (Miễn phí qua Imgur)</p>

        <!-- Khu vực chọn ảnh -->
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">🖼️</div>
            <div class="upload-text">Nhấn để chọn ảnh hoặc kéo thả vào đây</div>
            <div class="upload-hint">Hỗ trợ JPG, PNG, GIF, WEBP (Tối đa 10MB)</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <!-- Xem trước ảnh -->
        <div class="preview-container" id="previewContainer">
            <img id="previewImage" src="" alt="Preview">
        </div>

        <!-- Nút tải lên -->
        <button class="btn" id="uploadBtn" disabled>🚀 Tải lên và lấy link</button>

        <!-- Trạng thái đang xử lý -->
        <div class="loading" id="loading">
            <span class="spinner"></span> Đang tải ảnh lên...
        </div>

        <!-- Kết quả link -->
        <div class="result" id="result">
            <label>✅ Liên kết ảnh của bạn:</label>
            <div class="link-box">
                <input type="text" id="linkInput" readonly>
                <button class="copy-btn" id="copyBtn">Sao chép</button>
            </div>
        </div>

        <!-- Thông báo lỗi -->
        <div class="error" id="error"></div>
    </div>

    <script>
        // ============================================================
        // 🔑 QUAN TRỌNG: Thay thế 'YOUR_IMGUR_CLIENT_ID' bằng Client ID của bạn
        // Lấy Client ID miễn phí tại: https://api.imgur.com/oauth2/addclient
        // ============================================================
        const IMGUR_CLIENT_ID = 'YOUR_IMGUR_CLIENT_ID';

        // Lấy các phần tử DOM
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const uploadBtn = document.getElementById('uploadBtn');
        const loadingDiv = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const linkInput = document.getElementById('linkInput');
        const copyBtn = document.getElementById('copyBtn');
        const errorDiv = document.getElementById('error');

        let selectedFile = null;

        // ------------------------------------------------------------
        // 1. Xử lý chọn file (click hoặc kéo thả)
        // ------------------------------------------------------------
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        // ------------------------------------------------------------
        // 2. Kiểm tra file và hiển thị xem trước
        // ------------------------------------------------------------
        function handleFile(file) {
            // Kiểm tra định dạng ảnh
            if (!file.type.startsWith('image/')) {
                showError('Vui lòng chọn một tệp ảnh (JPG, PNG, GIF, WEBP).');
                return;
            }

            // Kiểm tra kích thước (tối đa 10MB)
            if (file.size > 10 * 1024 * 1024) {
                showError('Kích thước ảnh quá lớn. Vui lòng chọn ảnh dưới 10MB.');
                return;
            }

            selectedFile = file;
            hideError();
            hideResult();

            // Hiển thị xem trước
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.style.display = 'block';
                uploadBtn.disabled = false;
            };
            reader.readAsDataURL(file);

            // Cập nhật giao diện khu vực upload
            uploadArea.querySelector('.upload-text').textContent = `📎 ${file.name}`;
        }

        // ------------------------------------------------------------
        // 3. Tải ảnh lên Imgur và lấy link
        // ------------------------------------------------------------
        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            // Kiểm tra Client ID đã được cấu hình chưa
            if (IMGUR_CLIENT_ID === 'YOUR_IMGUR_CLIENT_ID') {
                showError('Bạn chưa cấu hình Client ID. Vui lòng làm theo hướng dẫn trong mã nguồn.');
                return;
            }

            // Hiển thị trạng thái loading
            setLoading(true);
            hideError();
            hideResult();

            try {
                const formData = new FormData();
                formData.append('image', selectedFile);
                formData.append('type', 'file');

                const response = await fetch('https://api.imgur.com/3/image', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Client-ID ${IMGUR_CLIENT_ID}`
                    },
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    // Lấy link trực tiếp từ dữ liệu trả về
                    const imageLink = data.data.link;
                    linkInput.value = imageLink;
                    resultDiv.style.display = 'block';
                } else {
                    // Xử lý lỗi từ API
                    const errorMsg = data.data?.error || 'Tải ảnh thất bại. Vui lòng thử lại.';
                    showError(errorMsg);
                }
            } catch (error) {
                console.error('Lỗi khi tải ảnh:', error);
                showError('Không thể kết nối đến máy chủ Imgur. Vui lòng kiểm tra mạng và thử lại.');
            } finally {
                setLoading(false);
            }
        });

        // ------------------------------------------------------------
        // 4. Sao chép link vào clipboard
        // ------------------------------------------------------------
        copyBtn.addEventListener('click', async () => {
            const link = linkInput.value;
            if (!link) return;

            try {
                await navigator.clipboard.writeText(link);
                copyBtn.textContent = 'Đã sao chép!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = 'Sao chép';
                    copyBtn.classList.remove('copied');
                }, 2000);
            } catch (err) {
                // Phương án dự phòng cho trình duyệt cũ
                linkInput.select();
                document.execCommand('copy');
                copyBtn.textContent = 'Đã sao chép!';
                setTimeout(() => {
                    copyBtn.textContent = 'Sao chép';
                }, 2000);
            }
        });

        // ------------------------------------------------------------
        // 5. Các hàm tiện ích hiển thị trạng thái
        // ------------------------------------------------------------
        function setLoading(isLoading) {
            loadingDiv.style.display = isLoading ? 'block' : 'none';
            uploadBtn.disabled = isLoading;
        }

        function showError(message) {
            errorDiv.textContent = '❌ ' + message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            errorDiv.style.display = 'none';
        }

        function hideResult() {
            resultDiv.style.display = 'none';
        }
    </script>

</body>
</html>
