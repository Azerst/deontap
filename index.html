<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZERST SEARCH — Free Fire</title>
<style>
/* ===== FONTS GFF ===== */
@font-face{
  font-family:"GFF-Latin-Bold";
  src:
    url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),
    url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");
  font-display:swap;
}
@font-face{
  font-family:"GFF-Latin-Black";
  src:
    url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Black.woff2") format("woff2"),
    url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Black.woff") format("woff");
  font-display:swap;
}

:root{
  --font-heading:"GFF-Latin-Black","GFF-Latin-Bold",system-ui,sans-serif;
  --font-body:"GFF-Latin-Bold","Segoe UI",Roboto,Arial,sans-serif;
  --glass-bg:rgba(12,18,32,.30);
  --glass-border:rgba(255,255,255,.16);
  --gold-1:#ffe9a8;
  --gold-2:#e9b73f;
  --text-primary:#f5f9ff;
}

*{ box-sizing:border-box; }
html, body{ min-height:100%; }

body{
  margin:0;
  font-family:var(--font-body);
  color:var(--text-primary);
  background:#05070d;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed; inset:0; z-index:-2;
  background-image:url("https://dl.aw.freefiremobile.com/common/OB55/CSH/gacha/TokenWheel3_20261108_FistCosmicComet_LobbyBG_VN_vn.png");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}
body::after{
  content:"";
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%, transparent 25%, rgba(0,5,15,.5) 100%);
}

.glass{
  background:var(--glass-bg);
  backdrop-filter:blur(22px) saturate(1.4);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid var(--glass-border);
  box-shadow:
    0 8px 32px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 -1px 0 rgba(0,0,0,.1);
}

/* ===== HEADER ===== */
header{
  position:sticky; top:0; z-index:50;
  padding:14px 16px 4px;
}
.wrap{ max-width:980px; margin:0 auto; }
.header-panel{ border-radius:22px; padding:14px 18px; }

.title-row{
  display:flex; align-items:center; gap:12px;
  flex-wrap:wrap; margin-bottom:12px;
}

.title-block{
  display:flex; flex-direction:column; gap:2px; min-width:0;
}
.brand{
  font-family:var(--font-heading);
  font-size:11px;
  letter-spacing:5px;
  color:var(--gold-1);
  text-shadow:0 0 18px rgba(255,220,130,.55), 0 1px 4px rgba(0,0,0,.5);
  line-height:1;
  opacity:.95;
}
h1{
  font-family:var(--font-heading);
  font-size:20px; margin:0; letter-spacing:.8px;
  background:linear-gradient(90deg,#fff3c4,#a9d8ff 50%,#d6b8ff);
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
  text-shadow:0 0 30px rgba(160,200,255,.4);
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.45));
  line-height:1.1;
}

.count-badge{
  font-size:12px; padding:6px 12px; border-radius:999px;
  color:#d8e6ff;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  white-space:nowrap;
}

.actions{
  margin-left:auto;
  display:flex; gap:8px; flex-wrap:wrap;
}

.btn{
  display:inline-flex; align-items:center; gap:6px;
  font-family:inherit; font-size:12px;
  padding:9px 14px; border-radius:12px;
  cursor:pointer; white-space:nowrap;
  color:#eaf2ff;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:all .2s;
  user-select:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}
.btn svg{ width:15px; height:15px; fill:currentColor; flex:0 0 auto; }
.btn:hover{
  background:rgba(255,255,255,.16);
  border-color:rgba(255,255,255,.35);
  transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(100,160,255,.28), inset 0 1px 0 rgba(255,255,255,.2);
}
.btn:active{ transform:scale(.97); }

.btn.primary{
  color:#1a1206;
  background:linear-gradient(135deg,#ffe9a8,#f0bd48);
  border-color:rgba(255,220,130,.6);
  box-shadow:0 6px 22px rgba(240,189,72,.4), inset 0 1px 0 rgba(255,255,255,.4);
  font-weight:800;
}
.btn.primary:hover{
  background:linear-gradient(135deg,#fff0c2,#f5c858);
  box-shadow:0 10px 30px rgba(240,189,72,.55), inset 0 1px 0 rgba(255,255,255,.5);
}
.btn[disabled]{ opacity:.5; cursor:not-allowed; transform:none !important; box-shadow:none !important; }

/* ===== SEARCH ===== */
.search-box{ position:relative; display:flex; align-items:center; }
.search-box > svg{
  position:absolute; left:16px; width:18px; height:18px;
  opacity:.7; pointer-events:none; fill:#a9cfff;
}
#searchInput{
  width:100%;
  padding:14px 100px 14px 46px;
  font-family:inherit; font-size:14px;
  color:#f5f9ff;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.16);
  border-radius:14px;
  outline:none;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  transition:all .2s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}
#searchInput::placeholder{ color:rgba(200,215,240,.55); }
#searchInput:focus{
  border-color:rgba(160,210,255,.7);
  background:rgba(255,255,255,.1);
  box-shadow:
    0 0 0 4px rgba(120,180,255,.15),
    inset 0 1px 0 rgba(255,255,255,.12),
    0 0 30px rgba(100,170,255,.25);
}
#clearBtn{
  position:absolute; right:8px;
  font-family:inherit; font-size:12px;
  padding:9px 14px; border-radius:10px; cursor:pointer;
  color:#1a1206;
  background:linear-gradient(135deg,#ffe9a8,#f5c451);
  border:none;
  opacity:0; transform:scale(.9); pointer-events:none;
  transition:all .2s;
  font-weight:800;
}
#clearBtn.show{ opacity:1; transform:scale(1); pointer-events:auto; }
#clearBtn:active{ transform:scale(.94); }

/* ===== MAIN ===== */
main{ padding:14px 16px 100px; }
#list{ display:flex; flex-direction:column; gap:10px; }

.item{
  display:flex; align-items:flex-start; gap:12px;
  padding:12px 16px; border-radius:14px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.11);
  backdrop-filter:blur(16px) saturate(1.3);
  -webkit-backdrop-filter:blur(16px) saturate(1.3);
  box-shadow:0 4px 20px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.08);
  transition:all .18s;
  animation:fadeIn .25s ease both;
  position:relative; overflow:hidden;
}
.item::before{
  content:"";
  position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);
  pointer-events:none;
}
.item:hover{
  background:rgba(255,255,255,.11);
  border-color:rgba(160,210,255,.38);
  transform:translateX(3px);
  box-shadow:0 6px 26px rgba(100,160,255,.2), inset 0 1px 0 rgba(255,255,255,.15);
}
@keyframes fadeIn{
  from{ opacity:0; transform:translateY(6px); }
  to{ opacity:1; transform:translateY(0); }
}

.idx{
  flex:0 0 auto; min-width:62px; text-align:center;
  font-size:12px; padding:6px 8px; border-radius:10px;
  color:#1a1206;
  background:linear-gradient(135deg,var(--gold-1),var(--gold-2));
  box-shadow:0 3px 12px rgba(233,183,63,.35), inset 0 1px 0 rgba(255,255,255,.4);
  letter-spacing:.3px;
  font-weight:800;
}
.idx.seq{
  /* badge kiểu khác khi đang search (số thứ tự 1,2,3...) */
  background:linear-gradient(135deg,#a9e7ff,#5fc8ff);
  box-shadow:0 3px 12px rgba(95,200,255,.42), inset 0 1px 0 rgba(255,255,255,.5);
}

.text{
  flex:1 1 auto; font-size:14px; line-height:1.55;
  color:#eef4ff; word-break:break-word; white-space:pre-wrap;
  min-width:0;
  text-shadow:0 1px 3px rgba(0,0,0,.35);
}
mark{
  color:#14181f;
  background:linear-gradient(135deg,#b9ecff,#5fc8ff);
  border-radius:4px; padding:0 3px;
  box-shadow:0 0 12px rgba(95,200,255,.5);
  font-weight:800;
}

.empty{
  text-align:center; padding:60px 20px;
  color:rgba(220,232,250,.7); font-size:14px; line-height:1.7;
}
#sentinel{ height:1px; }
#loading{
  text-align:center; padding:20px;
  font-size:12px; color:rgba(190,210,240,.7); letter-spacing:.5px;
}

/* ===== TOAST ===== */
#toast{
  position:fixed; left:50%; bottom:26px;
  transform:translateX(-50%) translateY(20px);
  opacity:0; pointer-events:none;
  padding:12px 22px; border-radius:14px;
  background:rgba(15,22,40,.7);
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid rgba(160,210,255,.35);
  color:#eaf2ff; font-size:13px;
  box-shadow:0 16px 44px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12), 0 0 30px rgba(100,170,255,.2);
  transition:opacity .22s, transform .22s;
  z-index:200; max-width:calc(100vw - 32px);
  text-align:center;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
#toast.gold{
  border-color:rgba(255,220,130,.5);
  color:#ffeeb8;
  box-shadow:0 16px 44px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15), 0 0 30px rgba(255,200,80,.25);
}

/* ===== OVERLAY ===== */
#loader{
  position:fixed; inset:0; z-index:100;
  display:none; align-items:center; justify-content:center;
  padding:20px;
  background:rgba(3,6,14,.72);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
#loader.show{ display:flex; }
.loader-card{
  width:100%; max-width:520px;
  padding:28px 26px; border-radius:22px;
  background:rgba(18,26,46,.6);
  backdrop-filter:blur(28px) saturate(1.5);
  -webkit-backdrop-filter:blur(28px) saturate(1.5);
  border:1px solid rgba(160,200,255,.28);
  box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.15);
  text-align:center;
}
.loader-card h2{
  margin:0 0 10px; font-family:var(--font-heading); font-size:18px;
  background:linear-gradient(90deg,#ffe9a8,#a9d8ff);
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
}
.loader-card p{
  margin:0 0 16px; font-size:13px; line-height:1.7;
  color:rgba(210,225,248,.85);
}
.loader-card b{ color:#ffe9a8; }
.btn-file{
  display:inline-block; padding:13px 24px; border-radius:13px;
  font-size:14px; cursor:pointer;
  color:#1a1206;
  background:linear-gradient(135deg,#ffe9a8,#f0bd48);
  box-shadow:0 10px 30px rgba(240,189,72,.4), inset 0 1px 0 rgba(255,255,255,.4);
  transition:all .18s;
  user-select:none;
  font-weight:800;
}
.btn-file:hover{ transform:translateY(-2px); box-shadow:0 14px 36px rgba(240,189,72,.55); }
.btn-file:active{ transform:scale(.97); }
.hint{ margin:14px 0 0 !important; font-size:12px !important; color:rgba(190,205,230,.6) !important; }
.loader-card details{
  margin-top:18px; text-align:left;
  border-top:1px solid rgba(160,200,255,.18);
  padding-top:14px;
}
.loader-card summary{
  cursor:pointer; font-size:13px; color:#a9cfff; outline:none; user-select:none;
}
#pasteArea{
  width:100%; height:110px; margin-top:12px;
  padding:12px 14px; font-family:inherit; font-size:12px;
  color:#eaf2ff;
  background:rgba(8,12,22,.7);
  border:1px solid rgba(160,200,255,.25);
  border-radius:12px;
  resize:vertical; outline:none;
  backdrop-filter:blur(10px);
}
#pasteArea:focus{ border-color:rgba(160,210,255,.7); }
#pasteBtn{
  margin-top:10px; padding:11px 20px;
  font-family:inherit; font-size:13px;
  border-radius:11px;
  border:1px solid rgba(160,200,255,.4);
  background:rgba(90,150,255,.25);
  color:#eaf2ff;
  cursor:pointer;
  transition:all .18s;
  backdrop-filter:blur(10px);
  font-weight:800;
}
#pasteBtn:hover{ background:rgba(90,150,255,.4); border-color:rgba(160,210,255,.7); }
.drop-active .loader-card{
  border-color:rgba(255,224,138,.9);
  box-shadow:0 0 0 4px rgba(255,224,138,.25), 0 30px 80px rgba(0,0,0,.6);
}

::-webkit-scrollbar{ width:10px; }
::-webkit-scrollbar-track{ background:rgba(255,255,255,.03); }
::-webkit-scrollbar-thumb{
  background:rgba(160,200,255,.4);
  border-radius:10px; border:2px solid transparent; background-clip:content-box;
}
::-webkit-scrollbar-thumb:hover{ background:rgba(160,200,255,.65); background-clip:content-box; }

@media (max-width:560px){
  .idx{ min-width:52px; font-size:11px; }
  .text{ font-size:13px; }
  h1{ font-size:16px; }
  .brand{ font-size:10px; letter-spacing:4px; }
  .count-badge{ font-size:11px; padding:4px 9px; }
  .btn{ padding:8px 11px; font-size:11px; }
  .btn svg{ width:13px; height:13px; }
  #searchInput{ padding-right:88px; font-size:13px; padding-left:42px; }
  .title-row{ gap:8px; }
  .actions{ width:100%; margin-left:0; }
  .header-panel{ padding:12px 14px; border-radius:18px; }
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="header-panel glass">
      <div class="title-row">
        <div class="title-block">
          <span class="brand">AZERST</span>
          <h1>AZERST SEARCH</h1>
        </div>
        <span class="count-badge" id="countBadge">0 item</span>
        <div class="actions">
          <button class="btn" id="copyBtn" type="button" title="Sao chép tất cả kết quả">
            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            Sao chép
          </button>
          <button class="btn primary" id="imageBtn" type="button" title="Lưu tất cả kết quả thành ảnh PNG">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Lưu ảnh
          </button>
        </div>
      </div>

      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <input id="searchInput" type="text" placeholder="Nhập nội dung hoặc số index..." autocomplete="off" spellcheck="false">
        <button id="clearBtn" type="button">Xóa</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="list"></div>
    <div id="loading">Đang tải...</div>
    <div id="sentinel"></div>
  </div>
</main>

<div id="toast"></div>

<div id="loader" class="show">
  <div class="loader-card">
    <h2>Chưa có dữ liệu</h2>
    <p>Đặt file <b>AzerstOB56VN.txt</b> cùng thư mục với file HTML này rồi mở lại trang.<br>Hoặc chọn file bên dưới:</p>
    <label class="btn-file">
      Chọn file .txt
      <input type="file" id="fileInput" accept=".txt,text/plain" hidden>
    </label>
    <p class="hint">… hoặc kéo &amp; thả file vào đây</p>
    <details>
      <summary>Dán nội dung trực tiếp</summary>
      <textarea id="pasteArea" placeholder="index&#9;text&#10;0&#9;Balo - Đại Đao Zabuza&#10;1&#9;Đã nâng cấp {0}"></textarea>
      <button id="pasteBtn" type="button">Nạp dữ liệu</button>
    </details>
  </div>
</div>

<script>
(function () {
  "use strict";

  var el = function (id) { return document.getElementById(id); };
  var state = { data: [], results: [], rendered: 0, pageSize: 100, query: "" };

  var listEl      = el("list");
  var loadingEl   = el("loading");
  var sentinelEl  = el("sentinel");
  var countBadge  = el("countBadge");
  var searchInput = el("searchInput");
  var clearBtn    = el("clearBtn");
  var loaderEl    = el("loader");
  var copyBtn     = el("copyBtn");
  var imageBtn    = el("imageBtn");
  var toastEl     = el("toast");

  /* ================= TOAST ================= */
  var toastTimer = null;
  function toast(msg, gold) {
    toastEl.textContent = msg;
    toastEl.classList.toggle("gold", !!gold);
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2400);
  }

  /* ================= CHUẨN HÓA ================= */
  function normChar(ch) {
    var base = ch.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    if (!base) base = ch;
    var c = base.charAt(0).toLowerCase();
    if (c === "đ") c = "d";
    return c;
  }
  function norm(str) {
    var out = "";
    for (var k = 0; k < str.length; k++) out += normChar(str.charAt(k));
    return out;
  }
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* ================= PARSE ================= */
  function parseData(raw) {
    var lines = raw.split(/\r?\n/);
    var arr = [];
    for (var k = 0; k < lines.length; k++) {
      var line = lines[k];
      if (!line) continue;
      var tab = line.indexOf("\t");
      if (tab === -1) continue;
      var idxStr = line.substring(0, tab).trim();
      if (!/^\d+$/.test(idxStr)) continue;
      var content = line.substring(tab + 1);
      if (content === "") continue;
      arr.push({ i: parseInt(idxStr, 10), text: content, n: norm(content) });
    }
    return arr;
  }

  /* ================= RENDER ================= */
  function highlight(text, normText, q) {
    if (!q) return escapeHtml(text);
    var nq = norm(q);
    if (!nq) return escapeHtml(text);
    var out = "", pos = 0, idx;
    while ((idx = normText.indexOf(nq, pos)) !== -1) {
      out += escapeHtml(text.substring(pos, idx));
      out += "<mark>" + escapeHtml(text.substr(idx, nq.length)) + "</mark>";
      pos = idx + nq.length;
    }
    out += escapeHtml(text.substring(pos));
    return out;
  }

  // displayNum: số sẽ hiển thị trên badge (gốc hoặc 1-based khi search)
  // isSeq: true nếu là số tuần tự (khi search) → đổi màu badge
  function makeRow(item, q, displayNum, isSeq) {
    var row = document.createElement("div");
    row.className = "item";

    var idx = document.createElement("div");
    idx.className = "idx" + (isSeq ? " seq" : "");
    idx.textContent = displayNum;

    var txt = document.createElement("div");
    txt.className = "text";
    txt.innerHTML = highlight(item.text, item.n, q);

    row.appendChild(idx);
    row.appendChild(txt);
    return row;
  }

  function renderMore() {
    if (state.rendered >= state.results.length) {
      loadingEl.style.display = "none";
      return;
    }
    var isSearch = !!state.query.trim();
    var end = Math.min(state.rendered + state.pageSize, state.results.length);
    var frag = document.createDocumentFragment();
    for (var k = state.rendered; k < end; k++) {
      var item = state.results[k];
      var displayNum = isSearch ? (k + 1) : item.i;
      frag.appendChild(makeRow(item, state.query, displayNum, isSearch));
    }
    listEl.appendChild(frag);
    state.rendered = end;
    loadingEl.style.display = (state.rendered < state.results.length) ? "block" : "none";
    loadingEl.textContent = "Đang tải thêm... (" + state.rendered + "/" + state.results.length + ")";
  }

  function applyFilter(q) {
    state.query = q;
    var key = norm(q.trim());
    if (!key) {
      state.results = state.data;
    } else {
      var res = [];
      var data = state.data;
      for (var k = 0; k < data.length; k++) {
        var it = data[k];
        if (it.n.indexOf(key) !== -1 || String(it.i).indexOf(key) !== -1) res.push(it);
      }
      state.results = res;
    }
    state.rendered = 0;
    listEl.innerHTML = "";
    updateCount();
    if (state.results.length === 0) {
      loadingEl.style.display = "none";
      listEl.innerHTML = '<div class="empty">Không tìm thấy kết quả nào phù hợp.<br>Thử một từ khóa khác nhé!</div>';
      return;
    }
    renderMore();
  }

  function updateCount() {
    if (!state.data.length) { countBadge.textContent = "0 item"; return; }
    if (!state.query.trim()) countBadge.textContent = state.data.length + " item";
    else countBadge.textContent = state.results.length + " / " + state.data.length + " item";
  }

  /* ================= LOAD ================= */
  function loadText(raw) {
    var arr = parseData(raw);
    if (!arr.length) {
      alert("Không đọc được dữ liệu. Hãy kiểm tra lại định dạng file (index TAB text).");
      return;
    }
    state.data = arr;
    state.results = arr;
    state.rendered = 0;
    state.query = "";
    searchInput.value = "";
    clearBtn.classList.remove("show");
    listEl.innerHTML = "";
    loaderEl.classList.remove("show");
    updateCount();
    renderMore();
  }

  function readFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) { loadText(String(e.target.result)); };
    reader.onerror = function () { alert("Đọc file thất bại!"); };
    reader.readAsText(file, "UTF-8");
  }

  /* ================= COPY ================= */
  async function copyAll() {
    var items = state.results;
    if (!items.length) { toast("Không có kết quả để sao chép"); return; }
    var isSearch = !!state.query.trim();
    // Khi search: xuất số tuần tự 1,2,3… (khớp với những gì hiển thị)
    // Khi không search: xuất index gốc
    var text = items.map(function (it, idx) {
      var num = isSearch ? (idx + 1) : it.i;
      return num + "\t" + it.text;
    }).join("\n");

    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        toast("Đã sao chép " + items.length + " item", true);
      } else throw new Error("no clipboard");
    } catch (e) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.top = "-9999px"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (_) {}
      document.body.removeChild(ta);
      toast(ok ? ("Đã sao chép " + items.length + " item") : "Sao chép thất bại", ok);
    }
  }

  /* ================= EXPORT IMAGE ================= */
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function safeName(s) {
    return s.replace(/[\\/:*?"<>|]+/g, "_").replace(/\s+/g, "_").slice(0, 40) || "all";
  }

  // Vẽ chuỗi có letter-spacing tuỳ chỉnh (canvas không hỗ trợ sẵn)
  function fillSpaced(ctx, text, x, y, spacing) {
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      ctx.fillText(c, x, y);
      x += ctx.measureText(c).width + spacing;
    }
    return x;
  }
  function measureSpaced(ctx, text, spacing) {
    var w = 0;
    for (var i = 0; i < text.length; i++) {
      w += ctx.measureText(text.charAt(i)).width;
      if (i < text.length - 1) w += spacing;
    }
    return w;
  }

  async function exportImage() {
    var items = state.results;
    if (!items.length) { toast("Không có kết quả để lưu"); return; }

    imageBtn.disabled = true;
    var old = imageBtn.innerHTML;
    imageBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg> Đang tạo...';

    try {
      try {
        await Promise.all([
          document.fonts.load('700 16px "GFF-Latin-Bold"'),
          document.fonts.load('900 28px "GFF-Latin-Black"'),
          document.fonts.load('900 18px "GFF-Latin-Black"')
        ]);
      } catch (e) {}

      var W = 1000, DPR = 2;
      var PAD_X = 28, BADGE_W = 82, BADGE_H = 30, GAP_BADGE = 18;
      var ROW_PAD_Y = 14, ROW_GAP = 10;
      var FONT_SIZE = 15, LINE_HEIGHT = 22;
      var textX = PAD_X + BADGE_W + GAP_BADGE + 12;
      var textW = W - textX - PAD_X;

      var FONT_REG   = '700 ' + FONT_SIZE + 'px "GFF-Latin-Bold", "Segoe UI", Roboto, Arial, sans-serif';
      var FONT_HEAD  = '900 28px "GFF-Latin-Black", "GFF-Latin-Bold", sans-serif';
      var FONT_BRAND = '900 16px "GFF-Latin-Black", "GFF-Latin-Bold", sans-serif';
      var FONT_SUB   = '700 14px "GFF-Latin-Bold", "Segoe UI", sans-serif';

      var mc = document.createElement('canvas').getContext('2d');
      mc.font = FONT_REG;

      function wrapText(text, maxW) {
        var lines = [], parts = text.split(/(\s+)/), cur = '';
        for (var k = 0; k < parts.length; k++) {
          var p = parts[k], test = cur + p;
          if (mc.measureText(test).width <= maxW) { cur = test; }
          else {
            if (cur.trim()) lines.push(cur.replace(/\s+$/, ""));
            if (mc.measureText(p).width > maxW) {
              var w = '';
              for (var c = 0; c < p.length; c++) {
                var ch = p.charAt(c);
                if (mc.measureText(w + ch).width > maxW && w) { lines.push(w); w = ch; }
                else w += ch;
              }
              cur = w;
            } else cur = p.replace(/^\s+/, "");
          }
        }
        if (cur) lines.push(cur.replace(/\s+$/, ""));
        return lines.length ? lines : [''];
      }

      var query = state.query.trim();
      var isSearch = !!query;

      // Badge: search → 1-based, không search → index gốc
      var rows = items.map(function (it, idx) {
        var lines = wrapText(it.text, textW);
        var h = Math.max(lines.length * LINE_HEIGHT + ROW_PAD_Y * 2, 50);
        var displayNum = isSearch ? (idx + 1) : it.i;
        return { i: displayNum, lines: lines, h: h };
      });

      var HEADER_H = 196, FOOTER_H = 62, MAX_H = 28000;

      var pages = [], cur = [], curH = HEADER_H + FOOTER_H;
      for (var k = 0; k < rows.length; k++) {
        var r = rows[k];
        if (curH + r.h + ROW_GAP > MAX_H && cur.length) {
          pages.push(cur); cur = []; curH = HEADER_H + FOOTER_H;
        }
        cur.push(r); curH += r.h + ROW_GAP;
      }
      if (cur.length) pages.push(cur);

      var total = items.length;
      var base = "azerst_search_" + safeName(query || "all");

      for (var p = 0; p < pages.length; p++) {
        var pageRows = pages[p];
        var H = HEADER_H + FOOTER_H + 10;
        for (var q = 0; q < pageRows.length; q++) H += pageRows[q].h + ROW_GAP;

        var canvas = document.createElement('canvas');
        canvas.width = W * DPR; canvas.height = H * DPR;
        var ctx = canvas.getContext('2d');
        ctx.scale(DPR, DPR);

        var bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#0b1526');
        bg.addColorStop(0.5, '#0a1220');
        bg.addColorStop(1, '#050912');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        var glow = ctx.createRadialGradient(W / 2, 0, 0, W / 2, 0, W * 0.9);
        glow.addColorStop(0, 'rgba(140,190,255,0.20)');
        glow.addColorStop(1, 'rgba(140,190,255,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, 380);

        ctx.strokeStyle = 'rgba(160,200,255,0.22)';
        ctx.lineWidth = 1;
        ctx.strokeRect(10, 10, W - 20, H - 20);

        /* ====== HEADER ====== */
        ctx.textBaseline = 'alphabetic';
        ctx.textAlign = 'start';

        // "AZERST" trên cùng, chữ nhỏ, vàng, giãn cách
        ctx.font = FONT_BRAND;
        var brandGrad = ctx.createLinearGradient(PAD_X, 0, PAD_X + 160, 0);
        brandGrad.addColorStop(0, '#fff3c4');
        brandGrad.addColorStop(1, '#e9b73f');
        ctx.fillStyle = brandGrad;
        // Bóng nhẹ
        ctx.shadowColor = 'rgba(255,220,130,0.55)';
        ctx.shadowBlur = 14;
        var brandY = 48;
        fillSpaced(ctx, 'AZERST', PAD_X, brandY, 8);
        ctx.shadowBlur = 0;

        // Đường kẻ trang trí sau "AZERST"
        var brandW = measureSpaced(ctx, 'AZERST', 8);
        ctx.strokeStyle = 'rgba(255,220,130,0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(PAD_X + brandW + 14, brandY - 5);
        ctx.lineTo(PAD_X + brandW + 100, brandY - 5);
        ctx.stroke();

        // "AZERST SEARCH" chính, gradient lớn
        ctx.font = FONT_HEAD;
        var grad = ctx.createLinearGradient(PAD_X, 0, PAD_X + 500, 0);
        grad.addColorStop(0, '#fff3c4');
        grad.addColorStop(0.55, '#a9d8ff');
        grad.addColorStop(1, '#d6b8ff');
        ctx.fillStyle = grad;
        ctx.fillText('AZERST SEARCH', PAD_X, 88);

        // Sub info
        ctx.font = FONT_SUB;
        ctx.fillStyle = 'rgba(200,220,245,0.88)';
        var info = isSearch
          ? 'Từ khóa: "' + query + '" · ' + total + ' kết quả'
          : 'Toàn bộ danh sách · ' + total + ' kết quả';
        ctx.fillText(info, PAD_X, 118);

        if (pages.length > 1) {
          ctx.fillStyle = 'rgba(255,220,140,0.95)';
          ctx.fillText('Trang ' + (p + 1) + '/' + pages.length, PAD_X, 140);
        }

        ctx.fillStyle = 'rgba(160,200,255,0.25)';
        ctx.fillRect(PAD_X, pages.length > 1 ? 156 : 138, W - PAD_X * 2, 1);

        /* ====== ROWS ====== */
        var ry = HEADER_H + 6;
        for (var r2 = 0; r2 < pageRows.length; r2++) {
          var row = pageRows[r2];
          var rowX = PAD_X, rowW = W - PAD_X * 2;

          roundRect(ctx, rowX, ry, rowW, row.h, 12);
          ctx.fillStyle = 'rgba(255,255,255,0.055)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(160,200,255,0.15)';
          ctx.lineWidth = 1;
          ctx.stroke();

          var bY = ry + (row.h - BADGE_H) / 2;
          // Đổi màu badge: search → xanh, không search → vàng
          var bgd = ctx.createLinearGradient(0, bY, 0, bY + BADGE_H);
          if (isSearch) {
            bgd.addColorStop(0, '#b9ecff');
            bgd.addColorStop(1, '#5fc8ff');
          } else {
            bgd.addColorStop(0, '#ffe9a8');
            bgd.addColorStop(1, '#e9b73f');
          }
          roundRect(ctx, rowX + 14, bY, BADGE_W, BADGE_H, 8);
          ctx.fillStyle = bgd;
          ctx.fill();

          ctx.fillStyle = '#1a1206';
          ctx.font = '800 13px "GFF-Latin-Bold", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(String(row.i), rowX + 14 + BADGE_W / 2, bY + BADGE_H / 2 + 5);
          ctx.textAlign = 'start';

          ctx.font = FONT_REG;
          ctx.fillStyle = '#eaf2ff';
          var ty = ry + ROW_PAD_Y + LINE_HEIGHT - 6;
          for (var l = 0; l < row.lines.length; l++) {
            ctx.fillText(row.lines[l], textX, ty);
            ty += LINE_HEIGHT;
          }
          ry += row.h + ROW_GAP;
        }

        // Footer
        ctx.font = '700 12px "GFF-Latin-Bold", sans-serif';
        ctx.fillStyle = 'rgba(160,190,230,0.6)';
        ctx.textAlign = 'start';
        ctx.fillText('AZERST SEARCH · ' + total + ' item', PAD_X, H - 30);

        var url = canvas.toDataURL('image/png');
        var a = document.createElement('a');
        var suffix = pages.length > 1 ? ('_part' + (p + 1)) : '';
        a.download = base + suffix + '.png';
        a.href = url;
        a.click();

        if (pages.length > 1 && p < pages.length - 1) {
          await new Promise(function (r) { setTimeout(r, 450); });
        }
      }

      toast(pages.length > 1
        ? ('Đã lưu ' + pages.length + ' ảnh (nội dung quá dài)')
        : 'Đã lưu ảnh thành công!', true);
    } catch (err) {
      console.error(err);
      toast('Tạo ảnh thất bại: ' + (err && err.message ? err.message : 'lỗi'));
    } finally {
      imageBtn.disabled = false;
      imageBtn.innerHTML = old;
    }
  }

  /* ================= EVENTS ================= */
  var timer = null;
  searchInput.addEventListener("input", function () {
    var v = searchInput.value;
    clearBtn.classList.toggle("show", v.length > 0);
    clearTimeout(timer);
    timer = setTimeout(function () { applyFilter(v); }, 110);
  });

  clearBtn.addEventListener("click", function () {
    searchInput.value = "";
    clearBtn.classList.remove("show");
    applyFilter("");
    searchInput.focus();
  });

  searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      searchInput.value = "";
      clearBtn.classList.remove("show");
      applyFilter("");
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== searchInput &&
        document.activeElement !== el("pasteArea")) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  copyBtn.addEventListener("click", copyAll);
  imageBtn.addEventListener("click", exportImage);
  el("fileInput").addEventListener("change", function (e) { readFile(e.target.files[0]); });

  el("pasteBtn").addEventListener("click", function () {
    var v = el("pasteArea").value;
    if (!v.trim()) { alert("Nội dung trống!"); return; }
    loadText(v);
  });

  ["dragenter", "dragover"].forEach(function (ev) {
    window.addEventListener(ev, function (e) {
      e.preventDefault();
      loaderEl.classList.add("drop-active");
    });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    window.addEventListener(ev, function (e) {
      e.preventDefault();
      if (ev === "dragleave" && e.relatedTarget) return;
      loaderEl.classList.remove("drop-active");
    });
  });
  window.addEventListener("drop", function (e) {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      readFile(e.dataTransfer.files[0]);
    }
  });

  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) { if (entry.isIntersecting) renderMore(); });
    }, { rootMargin: "600px 0px" });
    io.observe(sentinelEl);
  } else {
    window.addEventListener("scroll", function () {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 700) renderMore();
    });
  }

  /* ================= AUTO LOAD ================= */
  fetch("AzerstOB56VN.txt", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error("not found"); return r.text(); })
    .then(function (text) {
      if (text && text.indexOf("\t") !== -1) loadText(text);
      else loaderEl.classList.add("show");
    })
    .catch(function () { loaderEl.classList.add("show"); });

  loadingEl.style.display = "none";
})();
</script>
