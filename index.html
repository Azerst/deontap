<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tra Cứu Đáp Án Môn Toán</title>
    <!-- Font chữ hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <!-- Thư viện xuất ảnh -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-body: #f1f5f9;
            --bg-sidebar: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #10b981; /* Màu xanh lá cho Đúng */
            --danger: #ef4444;  /* Màu đỏ cho Sai */
            --warning: #f59e0b; /* Màu vàng cam cho Trả lời ngắn */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- SIDEBAR (CỘT TRÁI) --- */
        .sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 4px 0 15px rgba(0,0,0,0.03);
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .sidebar-header h2 {
            font-size: 18px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sidebar-header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .exam-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            align-content: start;
        }

        .exam-list::-webkit-scrollbar { width: 6px; }
        .exam-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .exam-btn {
            padding: 12px 10px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .exam-btn:hover {
            background: #e0e7ff;
            border-color: #a5b4fc;
            color: var(--primary);
        }

        .exam-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        /* --- MAIN CONTENT (CỘT PHẢI) --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            overflow-y: auto;
            position: relative;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .action-bar h1 {
            font-size: 24px;
            color: var(--text-main);
        }

        .btn-export {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }

        .btn-export:hover {
            background-color: #059669;
            transform: translateY(-2px);
        }

        /* --- KHU VỰC ĐỂ XUẤT ẢNH (GIẤY THI) --- */
        .export-area {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            border: 1px solid var(--border-color);
        }

        .print-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 20px;
        }
        
        .print-header h3 {
            font-size: 22px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .print-header p {
            font-size: 14px;
            color: var(--text-muted);
            font-style: italic;
        }

        .exam-code-highlight {
            margin-top: 15px;
            font-size: 20px;
            font-weight: 700;
            color: #b91c1c; /* Màu đỏ đô */
            background: #fef2f2;
            display: inline-block;
            padding: 5px 20px;
            border-radius: 8px;
            border: 1px dashed #fca5a5;
        }

        /* --- PHẦN 1: TRẮC NGHIỆM (GRID) --- */
        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin: 25px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title span {
            background: var(--primary);
            color: white;
            width: 24px; height: 24px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 50%;
            font-size: 14px;
        }

        .mc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .mc-item {
            display: flex;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: #f8fafc;
        }

        .mc-question {
            background: #e2e8f0;
            color: var(--text-main);
            font-weight: 600;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--border-color);
        }

        .mc-answer {
            flex: 1;
            padding: 10px;
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            color: var(--primary);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- PHẦN 2: ĐÚNG/SAI (TABLE) --- */
        .tf-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .tf-table th {
            background-color: #f8fafc;
            color: var(--text-main);
            font-weight: 600;
            padding: 12px;
            border: 1px solid var(--border-color);
        }

        .tf-table td {
            padding: 12px;
            border: 1px solid var(--border-color);
        }

        .tf-table td:first-child {
            font-weight: 600;
            background-color: #f8fafc;
            width: 100px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }

        .badge-dung { background-color: #d1fae5; color: #065f46; }
        .badge-sai { background-color: #fee2e2; color: #991b1b; }

        /* --- PHẦN 3: TRẢ LỜI NGẮN (TABLE) --- */
        .sa-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
            text-align: center;
        }

        .sa-table th {
            background-color: #f8fafc;
            color: var(--text-main);
            font-weight: 600;
            padding: 12px;
            border: 1px solid var(--border-color);
        }

        .sa-table td {
            padding: 12px;
            border: 1px solid var(--border-color);
        }

        .sa-table td:first-child {
            font-weight: 600;
            background-color: #f8fafc;
            width: 100px;
        }

        .sa-answer-text {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            color: #b91c1c;
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border-color); }
            .exam-list { grid-template-columns: repeat(4, 1fr); max-height: 200px; }
            .main-content { padding: 15px; }
            .action-bar { flex-direction: column; gap: 15px; align-items: flex-start; }
            .mc-grid { grid-template-columns: repeat(2, 1fr); }
            .export-area { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR: DANH SÁCH MÃ ĐỀ -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Môn Toán 12</h2>
            <p>Chọn mã đề để xem đáp án</p>
        </div>
        <div class="exam-list" id="examList">
            <!-- Nút mã đề render tự động -->
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="action-bar">
            <h1 id="currentExamTitle">Đang tải...</h1>
            <button class="btn-export" onclick="downloadImage()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Lưu ảnh đề này
            </button>
        </div>

        <!-- Khu vực chứa bảng đáp án (Được chụp ảnh) -->
        <div class="export-area" id="exportArea">
            <div class="print-header">
                <h3>ĐÁP ÁN VÀ THANG ĐIỂM MÔN TOÁN</h3>
                <p>Kỳ khảo sát chất lượng giữa học kỳ I - Lớp 12 - Năm học 2026-2027</p>
                <div class="exam-code-highlight" id="exportExamCode">MÃ ĐỀ: 0101</div>
            </div>

            <!-- PHẦN I: TRẮC NGHIỆM -->
            <div class="section-title"><span>I</span> PHẦN TRẮC NGHIỆM (Câu 1 - 12)</div>
            <div class="mc-grid" id="mcGrid">
                <!-- Render tự động -->
            </div>

            <!-- PHẦN II: ĐÚNG/SAI -->
            <div class="section-title"><span>II</span> PHẦN ĐÚNG/SAI (Câu 13 - 16)</div>
            <table class="tf-table">
                <thead>
                    <tr>
                        <th>Câu</th>
                        <th>Ý a</th>
                        <th>Ý b</th>
                        <th>Ý c</th>
                        <th>Ý d</th>
                    </tr>
                </thead>
                <tbody id="tfTableBody">
                    <!-- Render tự động -->
                </tbody>
            </table>

            <!-- PHẦN III: TRẢ LỜI NGẮN -->
            <div class="section-title"><span>III</span> PHẦN TRẢ LỜI NGẮN (Câu 17 - 22)</div>
            <table class="sa-table">
                <thead>
                    <tr>
                        <th>Câu</th>
                        <th>Đáp án</th>
                    </tr>
                </thead>
                <tbody id="saTableBody">
                    <!-- Render tự động -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // TOÀN BỘ DỮ LIỆU ĐÁP ÁN (Đã được trích xuất chính xác 100% từ ảnh)
        const data = {
            "0101": ["B","A","D","B","B","D","B","A","D","C","A","C","SDDD","SSDD","SDSS","DSDS","9.19","24","412","1.86","-5","12"],
            "0102": ["C","D","A","C","A","A","C","C","D","C","C","D","DDDD","DSDS","DSSD","SSDD","1056","9.93","1.86","2.4","-8","22"],
            "0103": ["C","C","A","D","D","D","D","C","C","B","A","A","DSDS","DDDD","DSSS","DSDD","12","24","412","9.19","-5","1.86"],
            "0104": ["C","A","D","D","B","A","D","B","D","D","B","C","DDDD","DSSS","DSDS","SSDD","22","9.93","1.86","2.4","-8","1056"],
            "0105": ["B","A","B","A","A","A","D","C","A","D","C","D","DSDD","DSSS","DDDS","DSDD","1.86","24","12","412","9.19","-5"],
            "0106": ["A","B","B","C","C","C","C","A","D","A","A","B","SDDD","SSDD","DSSD","DSDD","1056","-8","1.86","2.4","9.93","22"],
            "0107": ["A","A","A","C","D","C","B","C","D","A","A","A","DSSS","DDDS","SDDD","DSSD","24","412","1.86","-5","12","9.19"],
            "0108": ["B","C","A","D","D","D","B","C","B","D","B","D","DDDD","DDDD","DSDS","DDDS","1056","-8","-5","9.93","2.4","22"],
            "0109": ["C","A","C","A","D","A","A","D","A","C","B","D","SSDD","DSDS","DSSS","DSDD","24","9.19","1.86","412","12","1.86"],
            "0110": ["C","B","C","A","B","C","B","A","C","A","C","D","DDSD","SSSS","DDDD","DSDS","1056","-8","12","9.93","22","2.4"],
            "0111": ["A","B","A","A","D","C","D","C","B","B","D","D","SDDS","DSDS","DDDS","DSDD","1.86","412","-8","9.19","-5","24"],
            "0112": ["C","A","B","D","A","D","A","B","A","C","D","B","DDSD","DSDD","DSSS","DSDS","1056","1.86","1.86","9.93","22","2.4"],
            "0113": ["B","A","A","A","C","D","C","B","A","C","B","C","SSDD","DDDS","DSSD","DSDD","24","412","1056","-5","9.19","12"],
            "0114": ["B","D","B","D","D","A","B","D","C","C","D","C","DSDD","SSDD","DSSS","DSDD","9.93","1.86","12","-8","22","2.4"],
            "0115": ["B","B","B","B","D","D","D","D","A","D","A","A","DSSS","DSSS","DSSD","DSDD","9.19","412","1056","-5","24","1.86"],
            "0116": ["A","C","A","B","C","C","C","B","A","B","B","C","DDDD","DDDS","DDDD","DSDD","9.93","1.86","12","22","2.4","-8"],
            "0117": ["C","B","C","A","C","D","C","A","D","D","D","C","SDDS","DSSS","DSSS","DSDD","24","412","1.86","9.19","1.86","-5"],
            "0118": ["D","A","A","C","A","C","A","B","C","C","D","A","DSDS","DDSD","DDDS","DSDD","1056","9.93","9.19","22","-8","2.4"],
            "0119": ["A","A","A","C","C","A","D","B","D","C","A","C","DDSD","SSSD","SSSD","DSDD","24","-5","1.86","12","1.86","412"],
            "0120": ["D","A","D","D","A","D","C","A","D","A","C","B","SDDS","DDDS","DDDS","DSDD","9.93","2.4","24","1056","-8","22"],
            "0121": ["D","A","A","B","D","B","C","C","B","D","B","B","SSSD","DDDD","DDSD","DSDD","9.19","-5","-8","412","12","1.86"],
            "0122": ["A","D","D","B","C","B","A","C","C","B","C","B","DSDS","SDDD","DSSD","DSDD","22","2.4","1.86","1056","1.86","9.93"],
            "0123": ["A","C","D","A","C","D","D","A","C","A","A","D","DSSS","DSDD","DSSD","DSDD","24","9.19","1.86","412","12","-5"],
            "0124": ["C","D","D","D","B","B","B","B","C","A","C","C","DDSS","DDDD","SDDD","DSSD","22","2.4","1.86","1056","-8","9.93"]
        };

        let currentExamCode = "0101";

        // KHỞI TẠO DANH SÁCH MÃ ĐỀ
        function initSidebar() {
            const examList = document.getElementById('examList');
            const codes = Object.keys(data);
            
            codes.forEach(code => {
                const btn = document.createElement('button');
                btn.className = `exam-btn ${code === currentExamCode ? 'active' : ''}`;
                btn.innerText = code;
                btn.onclick = () => selectExam(code, btn);
                examList.appendChild(btn);
            });
        }

        // CHỌN MÃ ĐỀ VÀ RENDER BẢNG
        function selectExam(code, btnElement) {
            currentExamCode = code;
            
            document.querySelectorAll('.exam-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            document.getElementById('currentExamTitle').innerText = `Đáp án chi tiết: Mã đề ${code}`;
            document.getElementById('exportExamCode').innerText = `MÃ ĐỀ: ${code}`;

            const answers = data[code];

            // 1. RENDER PHẦN TRẮC NGHIỆM (Câu 1-12)
            const mcGrid = document.getElementById('mcGrid');
            mcGrid.innerHTML = '';
            for (let i = 0; i < 12; i++) {
                mcGrid.innerHTML += `
                    <div class="mc-item">
                        <div class="mc-question">Câu ${i + 1}</div>
                        <div class="mc-answer">${answers[i]}</div>
                    </div>
                `;
            }

            // 2. RENDER PHẦN ĐÚNG/SAI (Câu 13-16)
            const tfBody = document.getElementById('tfTableBody');
            tfBody.innerHTML = '';
            for (let i = 12; i < 16; i++) {
                const answerStr = answers[i]; // Ví dụ: "SDDD"
                let rowHtml = `<tr><td>Câu ${i + 1}</td>`;
                
                // Duyệt qua từng ký tự S/D
                for (let j = 0; j < 4; j++) {
                    const char = answerStr[j];
                    if (char === 'D') {
                        rowHtml += `<td><span class="badge badge-dung">Đúng</span></td>`;
                    } else if (char === 'S') {
                        rowHtml += `<td><span class="badge badge-sai">Sai</span></td>`;
                    } else {
                        rowHtml += `<td>${char}</td>`;
                    }
                }
                rowHtml += `</tr>`;
                tfBody.innerHTML += rowHtml;
            }

            // 3. RENDER PHẦN TRẢ LỜI NGẮN (Câu 17-22)
            const saBody = document.getElementById('saTableBody');
            saBody.innerHTML = '';
            for (let i = 16; i < 22; i++) {
                saBody.innerHTML += `
                    <tr>
                        <td>Câu ${i + 1}</td>
                        <td><span class="sa-answer-text">${answers[i]}</span></td>
                    </tr>
                `;
            }
        }

        // TÍNH NĂNG LƯU ẢNH
        function downloadImage() {
            const exportArea = document.getElementById('exportArea');
            const btn = document.querySelector('.btn-export');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = 'Đang xử lý...';
            btn.style.opacity = '0.7';

            // Chụp ảnh với độ phân giải cao (scale 2)
            html2canvas(exportArea, {
                scale: 2, 
                backgroundColor: "#ffffff",
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Dap_An_Toan_Ma_De_${currentExamCode}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();

                btn.innerHTML = originalText;
                btn.style.opacity = '1';
            }).catch(err => {
                console.error("Lỗi xuất ảnh: ", err);
                alert("Có lỗi xảy ra khi lưu ảnh!");
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
            });
        }

        // KHỞI CHẠY
        window.onload = () => {
            initSidebar();
            const firstBtn = document.querySelector('.exam-btn');
            selectExam(currentExamCode, firstBtn);
        };
    </script>
</body>
</html>
